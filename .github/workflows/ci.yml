name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - name: Install Lean (elan, pinned toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the protected kernel
        run: cd protected/lean && lake build
      - name: Unit tests that need no Docker
        run: node --test --test-concurrency=1 protected/tests/unit/canonical.test.ts protected/tests/unit/codex-adapter.test.ts
